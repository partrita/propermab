[workspace]
authors = ["deepthought <deepthough@postech.ac.kr>"]
channels = ["bioconda", "conda-forge", "pytorch", "main", "r", "msys2"]
name = "propermab"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
openmm = "*"
libstdcxx-ng = "*"
pdbfixer = "*"
anarci = "*"
scipy = ">=1.6"
biopython = ">=1.76,<=1.79"
py3dmol = "*"
python = ">=3.7,<3.9"
matplotlib = ">=3.5"
seaborn = ">=0.11"
numba = ">=0.50"
pdb2pqr = "*"
pip = "*"

[pypi-dependencies]
immunebuilder = ">=0.0.5, <=0.0.8"
freesasa = "==2.1.0"
open3d = "*"
propermab = { path = ".", editable = true }
